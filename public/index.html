<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スクアド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2ee;
    --stage-bg:#e9e5df;
    --surface:#ffffff;
    --surface-2:#faf8f5;
    --ink:#211d1a;
    --ink-soft:#6f665e;
    --ink-faint:#a89e93;
    --line:#e2dcd3;
    --line-strong:#cfc6ba;

    --accent-hair:#a3415a;
    --accent-hair-soft:#f1dee2;
    --accent-fashion:#93692b;
    --accent-fashion-soft:#ece1cd;
    --accent-restaurant:#3d6a5c;
    --accent-restaurant-soft:#dbe8e2;
    --accent-order:#42507a;
    --accent-order-soft:#dfe2ee;

    --user-bubble:#2c2723;
    --user-bubble-ink:#f7f4ef;
    --ai-bubble:#ffffff;

    --shadow:0 18px 40px -22px rgba(33,29,26,.35);
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;

    --font-display:"Shippori Mincho", "Hiragino Mincho ProN", serif;
    --font-body:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171513;
      --stage-bg:#0e0d0c;
      --surface:#221f1c;
      --surface-2:#28241f;
      --ink:#f2ede6;
      --ink-soft:#b7ac9f;
      --ink-faint:#7c7266;
      --line:#3a352e;
      --line-strong:#4a443b;

      --accent-hair:#e08ba0;
      --accent-hair-soft:#3a2429;
      --accent-fashion:#d8b56c;
      --accent-fashion-soft:#332a1a;
      --accent-restaurant:#8fc3af;
      --accent-restaurant-soft:#1f332c;
      --accent-order:#a9b3dd;
      --accent-order-soft:#242a3d;

      --user-bubble:#f2ede6;
      --user-bubble-ink:#211d1a;
      --ai-bubble:#2b2723;
      --shadow:0 18px 40px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171513;
    --stage-bg:#0e0d0c;
    --surface:#221f1c;
    --surface-2:#28241f;
    --ink:#f2ede6;
    --ink-soft:#b7ac9f;
    --ink-faint:#7c7266;
    --line:#3a352e;
    --line-strong:#4a443b;

    --accent-hair:#e08ba0;
    --accent-hair-soft:#3a2429;
    --accent-fashion:#d8b56c;
    --accent-fashion-soft:#332a1a;
    --accent-restaurant:#8fc3af;
    --accent-restaurant-soft:#1f332c;
    --accent-order:#a9b3dd;
    --accent-order-soft:#242a3d;

    --user-bubble:#f2ede6;
    --user-bubble-ink:#211d1a;
    --ai-bubble:#2b2723;
    --shadow:0 18px 40px -20px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .page{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:28px 14px 40px;
  }
  .page-eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  .page-title{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px;
  }

  /* ---------- device frame ---------- */
  .frame-shell{
    background:var(--stage-bg);
    border-radius:44px;
    padding:14px;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .phone{
    width:390px;
    max-width:calc(100vw - 40px);
    height:780px;
    max-height:82vh;
    background:var(--bg);
    border-radius:32px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .notch{
    position:absolute;
    top:8px; left:50%; transform:translateX(-50%);
    width:110px; height:22px;
    background:var(--stage-bg);
    border-radius:12px;
    z-index:30;
  }
  .statusbar{
    flex:0 0 auto;
    height:34px;
    background:var(--surface);
  }
  @media (max-width:460px){
    .statusbar{display:none;}
  }

  /* ---------- header ---------- */
  .app-header{
    flex:0 0 auto;
    padding:12px 18px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    transition:background .25s ease;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--tab-accent, var(--accent-hair));
    color:#fff;
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    flex:0 0 auto;
    transition:background .25s ease;
  }
  .header-text{flex:1 1 auto; min-width:0;}
  .header-mode{
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--tab-accent, var(--accent-hair));
    font-weight:700;
    transition:color .25s ease;
  }
  .header-app{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    line-height:1.3;
  }
  .bell{
    width:34px;height:34px;border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    flex:0 0 auto;
    color:var(--ink-soft);
  }
  .bell svg{width:16px;height:16px;}
  .bell .dot{
    position:absolute; top:6px; right:6px;
    width:7px;height:7px;border-radius:50%;
    background:var(--accent-hair);
    box-shadow:0 0 0 2px var(--surface);
    display:none;
  }
  .bell.has-note .dot{display:block;}

  /* ---------- screen / scroll area ---------- */
  .screen{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 14px 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:
      radial-gradient(circle at 100% 0%, var(--tab-accent-soft, var(--accent-hair-soft)) 0%, transparent 45%),
      var(--bg);
    transition:background .3s ease;
  }
  .screen::-webkit-scrollbar{width:6px;}
  .screen::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px;}

  /* ---------- bottom tab bar ---------- */
  .tabbar{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .tab-btn{
    appearance:none;border:none;background:none;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:6px 2px 4px;
    font-family:var(--font-body);
    font-size:10.5px;
    color:var(--ink-faint);
    cursor:pointer;
    border-radius:10px;
    position:relative;
  }
  .tab-btn svg{width:20px;height:20px;}
  .tab-btn.active{color:var(--tab-color);}
  .tab-btn .badge{
    position:absolute; top:2px; right:22%;
    width:7px;height:7px;border-radius:50%;
    background:var(--tab-color);
    display:none;
  }
  .tab-btn.has-badge .badge{display:block;}

  /* ---------- chat elements ---------- */
  .bubble-row{display:flex; gap:8px; align-items:flex-end;}
  .bubble-row.user{justify-content:flex-end;}
  .avatar-ai{
    width:26px;height:26px;border-radius:50%;
    background:var(--tab-accent, var(--accent-hair));
    color:#fff; font-size:11px; font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
    font-family:var(--font-display);
  }
  .bubble{
    max-width:78%;
    padding:11px 13px;
    border-radius:var(--radius-md);
    font-size:13.5px;
    line-height:1.65;
    box-shadow:0 2px 10px -6px rgba(0,0,0,.18);
  }
  .bubble.ai{
    background:var(--ai-bubble);
    color:var(--ink);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .bubble.user{
    background:var(--user-bubble);
    color:var(--user-bubble-ink);
    border-bottom-right-radius:4px;
  }
  .bubble img.thumb{
    width:120px;height:90px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px;
  }
  .typing-dots{display:flex;gap:3px;padding:4px 2px;}
  .typing-dots span{
    width:5px;height:5px;border-radius:50%;background:var(--ink-faint);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.2s;}
  .typing-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .chip-row{display:flex; flex-wrap:wrap; gap:7px; padding-left:34px;}
  .chip{
    appearance:none;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:12.5px;
    padding:8px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .chip:hover{border-color:var(--tab-accent, var(--accent-hair));}
  .chip:active{transform:scale(.96);}
  .chip.primary{
    background:var(--tab-accent, var(--accent-hair));
    border-color:transparent;
    color:#fff;
    font-weight:700;
  }
  .chip.selected{
    background:var(--tab-accent-soft, var(--accent-hair-soft));
    border-color:var(--tab-accent, var(--accent-hair));
    color:var(--tab-accent, var(--accent-hair));
    font-weight:700;
  }
  .chip[disabled]{opacity:.4; cursor:not-allowed;}

  /* ---------- catalog ---------- */
  .catalog-wrap{padding-left:34px; display:flex; flex-direction:column; gap:8px;}
  .catalog-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }
  .style-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    overflow:hidden;
    cursor:pointer;
    text-align:left;
    padding:0;
    position:relative;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    font-family:var(--font-body);
  }
  .fit-tag{
    position:absolute; top:6px; right:6px; z-index:5;
    background:var(--tab-accent, var(--accent-hair)); color:#fff;
    font-size:9.5px; font-weight:700; padding:3px 7px; border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }

  /* ---------- カタログ内アップロード導線（Web検索機能は権利面の懸念により廃止） ---------- */
  .upload-hint-row{
    padding-left:34px;
    margin-top:2px;
  }
  .style-card:hover{transform:translateY(-2px); box-shadow:0 10px 20px -14px rgba(0,0,0,.35); border-color:var(--tab-accent);}
  .style-card .duo{
    aspect-ratio:16/9;
    display:grid;
    grid-template-columns:1fr 1fr;
    position:relative;
  }
  .style-card .duo::after{
    content:"";
    position:absolute; left:50%; top:8%; bottom:8%; width:1px;
    background:rgba(255,255,255,.5);
  }
  .duo.duo-photo{ display:block; }
  .duo.duo-photo::after{ display:none; }
  .duo.duo-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .duo.duo-pending{
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); color:var(--ink-faint);
    font-size:11px; letter-spacing:.05em;
  }
  .style-card.is-pending{ cursor:not-allowed; opacity:.55; }
  .duo-panel{
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .duo-panel svg{width:52%; height:70%;}
  .duo-label{
    position:absolute; bottom:4px; left:6px;
    font-size:8px; letter-spacing:.06em;
    color:rgba(255,255,255,.85);
    background:rgba(0,0,0,.28);
    padding:1px 5px; border-radius:4px;
  }
  .style-card .meta{padding:8px 9px 10px;}
  .style-card .name{font-size:12.5px; font-weight:700; color:var(--ink);}
  .style-card .sub{font-size:10.5px; color:var(--ink-faint); margin-top:1px;}

  .full-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:0 10px 26px -18px rgba(0,0,0,.3);
  }
  .full-card .duo{aspect-ratio:16/9; display:grid; grid-template-columns:1fr 1fr; position:relative;}
  .full-card .duo::after{content:""; position:absolute; left:50%; top:6%; bottom:6%; width:1px; background:rgba(255,255,255,.5);}
  .full-card .duo.duo-photo{display:block;}
  .full-card .duo.duo-photo::after{display:none;}
  .full-card .duo-panel svg{width:46%; height:66%;}
  .full-card .meta{padding:12px 14px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .full-card .name{font-family:var(--font-display); font-size:15px; font-weight:700;}
  .full-card .sub{font-size:11px; color:var(--ink-faint);}

  .mock-badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:9.5px; letter-spacing:.05em;
    color:var(--ink-soft);
    background:var(--surface-2);
    border:1px dashed var(--line-strong);
    padding:3px 8px; border-radius:999px;
  }
  .mock-badge svg{width:10px;height:10px;}

  /* ---------- header icon buttons (bell / karte / info) ---------- */
  .header-icons{display:flex; gap:6px; flex:0 0 auto;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    flex:0 0 auto;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn.active{ color:var(--tab-accent, var(--accent-hair)); border-color:var(--tab-accent, var(--accent-hair)); }
  .icon-btn .dot{
    position:absolute; top:6px; right:6px;
    width:7px;height:7px;border-radius:50%;
    background:var(--accent-hair);
    box-shadow:0 0 0 2px var(--surface);
    display:none;
  }
  .icon-btn.has-note .dot{display:block;}

  /* ---------- subbar: persistent gender toggle ---------- */
  .subbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 14px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .subbar[hidden]{display:none;}
  .subbar-label{font-size:11px; color:var(--ink-faint); flex:0 0 auto;}
  .gender-toggle{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px; flex:0 0 auto;}
  .gender-toggle button{
    appearance:none;border:none;background:none;cursor:pointer;
    font-family:var(--font-body);font-size:12px;font-weight:700;
    padding:5px 15px;border-radius:999px;color:var(--ink-soft);
    transition:background .12s ease, color .12s ease;
  }
  .gender-toggle button.active{ background:var(--tab-accent, var(--accent-hair)); color:#fff; }

  /* ---------- composer (chat input) ---------- */
  .composer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 12px;
    background:var(--surface);
    border-top:1px solid var(--line);
    position:relative;
  }
  .composer[hidden]{display:none;}
  .composer-plus[hidden]{display:none;}
  .composer-plus, .composer-send{
    width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .composer-plus{ border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-soft); }
  .composer-plus svg{width:17px;height:17px;}
  .composer-input{
    flex:1 1 auto; min-width:0;
    border:1px solid var(--line-strong); border-radius:999px;
    padding:9px 15px; font-family:var(--font-body); font-size:13px;
    background:var(--surface-2); color:var(--ink);
  }
  .composer-input:focus{ outline:none; border-color:var(--tab-accent, var(--accent-hair)); }
  .composer-send{ border:none; background:var(--tab-accent, var(--accent-hair)); color:#fff; }
  .composer-send svg{width:15px;height:15px;}
  .composer-send[disabled]{opacity:.4; cursor:not-allowed;}
  .attach-menu{
    position:absolute; bottom:52px; left:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:6px; display:none; flex-direction:column; gap:2px; min-width:190px; z-index:40;
  }
  .attach-menu.open{display:flex;}
  .attach-menu button{
    appearance:none;border:none;background:none;text-align:left;
    padding:9px 10px;border-radius:8px;font-family:var(--font-body);font-size:12.5px;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;gap:8px;
  }
  .attach-menu button[hidden]{display:none;}
  .attach-menu button:hover{background:var(--surface-2);}
  .attach-menu button svg{width:15px;height:15px; color:var(--ink-soft);}

  /* ---------- about screen ---------- */
  .about-header{display:flex; gap:13px; align-items:center;}
  .about-avatar{
    width:60px;height:60px;border-radius:50%;flex:0 0 auto;
    background:var(--tab-accent, var(--accent-hair)); color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display); font-size:22px; font-weight:700;
    overflow:hidden;
  }
  .about-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .about-name{font-weight:700; font-size:14.5px;}
  .about-tagline{font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.6;}
  .series-list{ display:flex; flex-direction:column; }
  .series-row{
    display:flex; align-items:center; gap:10px;
    padding:11px 2px; text-decoration:none; color:var(--ink);
    background:none; border:none; border-bottom:1px solid var(--line);
    font-family:var(--font-body); cursor:pointer; width:100%; text-align:left;
  }
  .series-row:last-child{ border-bottom:none; }
  .series-row.soon{ cursor:default; }
  .series-icon{
    width:28px;height:28px;border-radius:50%; flex:0 0 auto;
    background:var(--tab-accent-soft); color:var(--tab-accent);
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .series-icon svg{width:14px;height:14px;}
  .series-text{ flex:1; min-width:0; display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
  .series-label{ font-size:13px; font-weight:700; }
  .series-sub{ font-size:11px; color:var(--ink-faint); }
  .series-arrow{ font-size:17px; color:var(--ink-faint); flex:0 0 auto; }
  .sns-row{display:flex; gap:10px; margin-top:2px;}
  .sns-btn{
    width:38px;height:38px;border-radius:50%;
    background:var(--surface-2); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .sns-btn svg{width:18px;height:18px;}
  .close-link{
    background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;
    padding:0;display:inline-flex;align-items:center;gap:4px;
  }

  /* ---------- generic screen furniture ---------- */
  .section-label{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:700; margin:2px 0 -2px;
  }
  .section-label-highlight{
    font-size:12.5px; letter-spacing:.04em; text-transform:none;
    color:#d64545; font-weight:800; margin:2px 0 -2px;
  }
  .empty-state{
    margin-top:auto; margin-bottom:auto;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:12px; padding:30px 14px; color:var(--ink-soft);
  }
  .empty-state svg{width:46px;height:46px; color:var(--tab-accent);}
  .empty-state p{margin:0; font-size:13px; line-height:1.7; max-width:230px;}
  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:13px;
    padding:11px 20px; border-radius:999px;
    background:var(--tab-accent, var(--accent-hair)); color:#fff;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn.ghost{
    background:transparent; color:var(--tab-accent, var(--accent-hair));
    border:1px solid var(--tab-accent, var(--accent-hair));
  }

  /* outfit / restaurant cards */
  .info-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:12px 13px;
    display:flex; gap:11px; align-items:flex-start;
  }
  .info-card .swatch{
    width:52px;height:52px;border-radius:10px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .info-card .swatch svg{width:26px;height:26px;}
  .info-card .body{flex:1 1 auto; min-width:0;}
  .info-card .title-row{display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .info-card .title{font-size:13.5px; font-weight:700;}
  .info-card .desc{font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.55;}
  .info-card .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px;}
  .tag{
    font-size:10px; padding:2px 8px; border-radius:999px;
    background:var(--tab-accent-soft); color:var(--tab-accent); font-weight:700;
  }
  .mini-btn{
    font-size:11px; font-weight:700; padding:6px 12px; border-radius:999px;
    border:1px solid var(--tab-accent); color:var(--tab-accent); background:transparent; cursor:pointer;
    white-space:nowrap;
  }
  .mini-btn.selected{background:var(--tab-accent); color:#fff; border-color:transparent;}

  .filter-row{display:flex; flex-wrap:wrap; gap:7px;}

  /* order sheet (karte) */
  .karte-head{display:flex; align-items:center; justify-content:space-between;}
  .karte-head h2{font-family:var(--font-display); font-size:16px; margin:0;}
  .diag-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .diag-item{
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:8px 6px; text-align:center;
  }
  .diag-item .k{font-size:9.5px; color:var(--ink-faint); letter-spacing:.05em;}
  .diag-item .v{font-size:12.5px; font-weight:700; margin-top:2px;}
  .diag-item select.v-select{
    font-size:12.5px; font-weight:700; margin-top:2px;
    border:none; background:transparent; color:var(--ink);
    font-family:var(--font-body); text-align:center; text-align-last:center;
    width:100%; cursor:pointer; -webkit-appearance:none; appearance:none;
  }
  .advice-box{
    background:var(--surface-2); border-left:3px solid var(--tab-accent);
    border-radius:0 10px 10px 0; padding:11px 13px; font-size:12.5px; line-height:1.7; color:var(--ink);
  }
  textarea.memo{
    width:100%; min-height:64px; resize:vertical;
    font-family:var(--font-body); font-size:12.5px; line-height:1.6;
    border:1px solid var(--line); border-radius:10px; padding:9px 10px;
    background:var(--surface); color:var(--ink);
  }
  .btn-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .btn-row .mini-btn{flex:1 1 auto; justify-content:center; display:inline-flex; align-items:center;}
  .btn-chatgpt{background:#10A37F; color:#fff; border-color:transparent;}
  .btn-gemini{background:#4285F4; color:#fff; border-color:transparent;}
  .upload-btn{
    width:100%; background:var(--surface); border:1.5px dashed var(--tab-accent);
    color:var(--tab-accent); border-radius:10px; padding:11px; font-size:12.5px;
    font-weight:700; cursor:pointer; font-family:var(--font-body);
  }
  .upload-confirm{
    font-size:12px; color:var(--tab-accent); font-weight:700; margin-top:8px;
    display:flex; align-items:center; gap:5px;
  }
  .sim-frame{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .sim-panel{
    aspect-ratio:3/4; border-radius:12px; overflow:hidden; position:relative;
    background:var(--surface-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .sim-panel img{width:100%; height:100%; object-fit:cover; filter:saturate(1.02);}
  .sim-panel .tag-abs{
    position:absolute; top:6px; left:6px;
    font-size:9px; background:rgba(0,0,0,.5); color:#fff; padding:2px 7px; border-radius:6px;
  }
  .quiz-block{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:13px 14px; display:flex; flex-direction:column; gap:8px;
  }
  .quiz-q{font-size:12.5px; font-weight:700;}
  .toast{
    position:absolute; left:50%; bottom:92px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg);
    font-size:12px; padding:9px 16px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s ease, bottom .25s ease;
    z-index:50; white-space:nowrap;
  }
  .toast.show{opacity:1; bottom:100px;}

  input[type=file]{display:none;}

  @media (max-width:460px){
    .frame-shell{border-radius:0; padding:0; box-shadow:none;}
    .phone{width:100vw; height:100dvh; max-height:100dvh; border-radius:0;}
    .page{padding:0;}
    .page-title, .page-eyebrow{display:none;}
    .notch{display:none;}
  }
</style>
</head>
<body>

<div class="page">
  <div class="page-eyebrow">HAIR Recipe &mdash; UI レイアウト検討プロトタイプ</div>
  <h1 class="page-title">チャットで作る、自分だけの髪型カルテ</h1>

  <div class="frame-shell">
    <div class="phone" id="phone">
      <div class="notch"></div>
      <div class="statusbar"></div>
      <header class="app-header" id="appHeader">
        <div class="brand-mark" id="brandMark">髪</div>
        <div class="header-text">
          <div class="header-mode" id="headerMode">スクアド ヘアスタイル</div>
          <div class="header-app" id="headerApp">ヘアアドバイザー</div>
        </div>
        <div class="header-icons">
          <button class="icon-btn" id="karteBtn" aria-label="カルテ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l3 3v15H7z"/><path d="M15 3v3h3M9 12h6M9 16h6M9 8h3"/></svg>
            <span class="dot"></span>
          </button>
          <button class="icon-btn" id="bellBtn" aria-label="通知">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="dot"></span>
          </button>
          <button class="icon-btn" id="infoBtn" aria-label="このアプリについて">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
          </button>
        </div>
      </header>

      <div class="subbar" id="subbar" hidden></div>

      <main class="screen" id="screen"></main>

      <div class="composer" id="composer" hidden>
        <button class="composer-plus" id="composerPlusBtn" aria-label="添付">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input class="composer-input" id="composerInput" type="text" placeholder="メッセージを入力（例：短くしたい）" autocomplete="off">
        <button class="composer-send" id="composerSendBtn" aria-label="送信">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
        </button>
        <div class="attach-menu" id="attachMenu">
          <button type="button" id="attachScreenshotBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
            <span>スクショを送信する</span>
          </button>
          <button type="button" id="attachFashionTodayBtn" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
            <span>今日の服装を送る</span>
          </button>
          <button type="button" id="attachFashionReferenceBtn" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
            <span>参考画像を送る</span>
          </button>
        </div>
      </div>

      <nav class="tabbar" id="tabbar"></nav>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<input type="file" id="fileScreenshot" accept="image/*">
<input type="file" id="fileFaceShape" accept="image/*">
<input type="file" id="fileGeneratedImage" accept="image/*">
<input type="file" id="fileHairComposite" accept="image/*">
<input type="file" id="fileFashionToday" accept="image/*">
<input type="file" id="fileFashionReference" accept="image/*">

      tab:"hair",
      gender:"women", // 性別はアプリ全体で共通・永続化。デフォルトは利用者の多いレディース
      faceShape:null,  // 顔型診断の結果（カタログのおすすめタグ表示に使用）
      chat:{ started:false, log:[] },
      selectedStyle:null,
      diagnosis:{ texture:null, crown:null, curl:null },
      generatedImage:null, // 外部AIで生成した仕上がりイメージ（この端末内のみ保持、サーバー非保存）
      userSelfiePhoto:null, // 「自分に似合うか試す」用の自撮り写真（この端末内のみ保持）
      pendingCompositeStyle:null, // 自撮りアップロード待ちの間、どの髪型で試そうとしていたかを一時保持
      outfit:null,
      seenFashionBadge:false,
      seenRestaurantBadge:false,
      seenOrderBadge:false,
      // ---- ファッションアドバイザー用 ----
      fashionChat:{ started:false, log:[] },
      fashionMode:null,            // 'check'（ファッションチェック） | 'coordinate'（色コーデ）
      fashionTaste:null,
      fashionPersonalColor:null,
      fashionOwnedTops:[],
      fashionOwnedBottoms:[],
      fashionDiagnosis:null,       // { top, bottom, topColor, bottomColor, jewelry }
      fashionLastAdviceType:null,  // 'today' | 'reference' | 'coordinate'
      fashionLastAdvice:null,      // { rawText, combo } コピー・詳細アドバイスで使用
      fashionLastDetailText:null,
      fashionAIAdvice:null,
      // ---- レストランアドバイザー用（チャット形式のヒアリング条件） ----
      restaurantChat:{ started:false, log:[] },
      restaurant:{
        step:null, category:null, mealtime:null,
        location:null, budgetLabel:null, budgetNote:null, extraNote:null
      }
    };
    try{
      var raw = localStorage.getItem("hairRecipeState_v1");
      if(raw){
        var parsed = JSON.parse(raw);
        var merged = Object.assign(fallback, parsed);
        // アクセスのたびに初期画面はヘアアドバイザーにする（前回タブは記憶しない）
        merged.tab = "hair";

    try{ localStorage.setItem("hairRecipeState_v1", JSON.stringify(state)); }catch(e){ /* ignore */ }

  function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
  function byId(id){ return document.getElementById(id); }
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function tabInfo(id){ for(var i=0;i<TABS.length;i++){ if(TABS[i].id===id) return TABS[i]; } return TABS[0]; }
  function styleById(id){ for(var i=0;i<CATALOG.length;i++){ if(CATALOG[i].id===id) return CATALOG[i]; } return null; }
  function lengthLabel(id){ for(var i=0;i<LENGTHS.length;i++){ if(LENGTHS[i].id===id) return LENGTHS[i].label; } return id; }
  function genderLabel(g){ return g==="men" ? "メンズ" : "レディース"; }
  function hueFromString(str){
    var h = 0;
    for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % 360; }
    return h;
  }
  function toast(msg){
    var t = byId("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._tm);
    toast._tm = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }
  function fileToDataUrl(file){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.readAsDataURL(file);
    });
  }
  // 画像を長辺maxDimpxに縮小し、JPEGで再圧縮する（スマホ写真そのままだと
  // サーバー側のリクエストサイズ上限に引っかかりやすいための対策）
  function resizeImageDataUrl(dataUrl, maxDim){
    return new Promise(function(resolve){
      if(!dataUrl){ resolve(dataUrl); return; }
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.92));
      };
      img.onerror = function(){ resolve(dataUrl); };
      img.src = dataUrl;
    });
  }
  // クリップボードAPIが使えない環境（モバイルの一部ブラウザ・アプリ内ブラウザ等）向けのフォールバック
  function fallbackCopyText(text){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){
      return false;
    }
  }
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast("コピーしました");
      }).catch(function(){
        toast(fallbackCopyText(text) ? "コピーしました" : "コピーできませんでした。手動で選択してコピーしてください");
      });
    }else{
      toast(fallbackCopyText(text) ? "コピーしました" : "コピーできませんでした。手動で選択してコピーしてください");
    }
  }
  // コピー＋外部の生成AIサービスを新規タブで開く（クリップボードAPIが使えない環境向けのフォールバック付き）
  async function copyAndOpen(text, url, serviceName){
    var copied = false;
    try{
      await navigator.clipboard.writeText(text);
      copied = true;
    }catch(e){
      copied = fallbackCopyText(text);
    }
    window.open(url, "_blank", "noopener");
    toast(copied ? "コピーしました。"+serviceName+"に貼り付けてください" : serviceName+"を開きました。プロンプトは手動でコピーしてください");
  }

  /* ---- 正面/サイド プレースホルダー用シルエットSVG ---- */
  function silhouetteSVG(kind, hue){
    var fill = "hsl(" + hue + ",38%,88%)";
    var stroke = "hsl(" + hue + ",32%,42%)";
    if(kind === "front"){
      return '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="34" r="20" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/><path d="M22 92c2-22 12-34 28-34s26 12 28 34" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5" stroke-linejoin="round"/></svg>';
    }
    return '<svg viewBox="0 0 100 100" fill="none"><path d="M38 20c14-4 26 4 28 16 1 6-1 9 2 12 3 3 6 2 6 6 0 3-4 4-7 5 1 5-1 9-5 11 2 4 1 8-2 10-8 5-22 4-30-4-9-9-9-26 1-38 2-3 4-6 7-8z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5" stroke-linejoin="round"/><path d="M18 92c1-18 8-28 18-31" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5" stroke-linecap="round"/></svg>';
  }
  function duoCardMarkup(style, size){
    // 「なりたい髪型」写真の解析結果は、本人がアップロードした参考写真をそのまま表示する
    // （分析結果が正しいかを本人が一目で確認できるようにするため）
    if(style.refPhoto){
      return '<div class="duo duo-photo"><img src="'+style.refPhoto+'" alt="'+style.name+'"></div>';
    }
    // 実アセットがある場合はそのまま1枚画像（正面+サイド+ヘッダー込み・16:9）を表示。
    if(style.img && IMAGES[style.img]){
      return '<div class="duo duo-photo"><img src="'+IMAGES[style.img]+'" alt="'+style.name+'"></div>';
    }
    if(style.pending){
      return '<div class="duo duo-pending"><span>準備中</span></div>';
    }
    var hue = hueFromString(style.id);
    var bgF = "hsl("+hue+",34%,93%)";
    var bgS = "hsl("+hue+",30%,89%)";
    return (
      '<div class="duo">'+
        '<div class="duo-panel" style="background:'+bgF+'">'+ silhouetteSVG("front", hue) +'<span class="duo-label">正面</span></div>'+
        '<div class="duo-panel" style="background:'+bgS+'">'+ silhouetteSVG("side", hue) +'<span class="duo-label">サイド</span></div>'+
      '</div>'
    );
  }

  /* =========================================================
     3. 🔧 実API連携ポイント（プレースホルダー実装）
     -----------------------------------------------------------
     本プロトタイプは画像素材とAI呼び出しをモックしています。
     本番実装ではこの2関数の中身だけを差し替えれば、
     UI/状態管理はそのまま利用できるように設計しています。
  ========================================================= */

  // 📸 スクショ解析: 本番では Vision API (Claude/Gemini 等) に画像を送信し、
  // 髪型カテゴリ・長さ・特徴を判定してカタログIDにマッピングする。
  // ここではモックとしてカタログからランダムに1件を「解析結果」として返す。
  // data:URL を { mimeType, base64 } に分解するヘルパー
  function dataUrlToParts(dataUrl){
    var m = /^data:(.*?);base64,(.*)$/.exec(dataUrl || "");
    return m ? { mimeType: m[1], base64: m[2] } : null;
  }

  // 📸 なりたい髪型の分析：カタログの中から近いものを当てるのではなく、
  // 写真そのものから「長さ・前髪・カラー・質感」を直接言葉で説明してもらい、
  // それをそのままオーダーシートの文言に反映する（カタログに縛られない）
  var ANALYSIS_LENGTHS  = ["ショート","ミディアム","ロング"];
  var ANALYSIS_BANGS    = ["シースルーバング","流し前髪","前髪なし","ぱっつん前髪","センターパート"];
  var ANALYSIS_COLORS   = ["黒髪","暗髪ブラウン","赤みブラウン","ベージュ","暗めゴールド","明るめ金髪","オレンジ系ゴールド","アッシュグレー"];
  var ANALYSIS_TEXTURES = ["ストレート","ゆるふわウェーブ","強めパーマ","無造作ウェーブ"];
  function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  // 分析結果（{length, bangs, color, texture}）から、他の画面でも扱えるスタイルオブジェクトを組み立てる。
  // refPhoto にアップロード写真を保持することで、確認画面ではイラストではなく本人の参考写真を表示できる。
  function buildStyleFromAnalysis(desc, refPhoto){
    return {
      id: "photo-" + Date.now(),
      gender: state.gender,
      length: desc.length,
      name: [desc.bangs, desc.color].filter(Boolean).join("×"),
      sub: [desc.length, desc.bangs, desc.color, desc.texture].filter(Boolean).join("／"),
      refPhoto: refPhoto,
      fromPhoto: true
    };
  }

  // 📸 なりたい髪型の分析: /api/analyze-screenshot（Gemini APIを呼ぶVercel Serverless Function）に
  // 画像を送信し、{ length, bangs, color, texture } の形で特徴を判定してもらう。
  // APIキー未設定・通信エラー時は、従来のモック（ランダムな特徴の組み合わせ）にフォールバックする。
  async function analyzeScreenshot(dataUrl){
    var parts = dataUrlToParts(dataUrl);
    if(parts){
      try{
        var res = await fetch("/api/analyze-screenshot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64: parts.base64, mimeType: parts.mimeType, gender: state.gender })
        });
        if(res.ok){
          var data = await res.json();
          if(data && data.length && data.bangs){
            var style = buildStyleFromAnalysis(data, dataUrl);
            return { style: style, confidence: (typeof data.confidence === "number" ? data.confidence : 0.8), mock:false };
          }
        }
      }catch(e){ /* 通信エラー時は下のモックにフォールバック */ }
    }
    await sleep(1100);
    var mockDesc = {
      length:  pickRandom(ANALYSIS_LENGTHS),
      bangs:   pickRandom(ANALYSIS_BANGS),
      color:   pickRandom(ANALYSIS_COLORS),
      texture: pickRandom(ANALYSIS_TEXTURES)
    };
    var style = buildStyleFromAnalysis(mockDesc, dataUrl);
    return { style: style, confidence: 0.7 + Math.random()*0.25, mock:true };
  }

  // 🧑‍🎨 顔型診断: /api/analyze-face-shape（Gemini APIを呼ぶVercel Serverless Function）に
  // 自撮り画像を送信し、顔型（骨格）の判定結果を受け取る。
  // 新しい画像を生成するわけではないため、フル生成AI（正面・サイド合成）より
  // 技術難易度・コスト・プライバシーリスクが低い代替案として採用。
  // APIキー未設定・通信エラー時は、従来のモック（ランダム選択）にフォールバックする。
  async function analyzeFaceShape(selfieDataUrl){
    var parts = dataUrlToParts(selfieDataUrl);
    if(parts){
      try{
        var res = await fetch("/api/analyze-face-shape", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64: parts.base64, mimeType: parts.mimeType })
        });
        if(res.ok){
          var data = await res.json();
          var matched = FACE_SHAPES.filter(function(x){ return x.id === data.faceShape; })[0];
          if(matched){
            return { faceShape: matched, confidence: (typeof data.confidence === "number" ? data.confidence : 0.8), mock:false };
          }
        }
      }catch(e){ /* 通信エラー時は下のモックにフォールバック */ }
    }
    await sleep(1000);
    var pick = FACE_SHAPES[Math.floor(Math.random()*FACE_SHAPES.length)];
    return { faceShape: pick, confidence: 0.65 + Math.random()*0.3, mock:true };
  }

  // 🔬 生成AI（正面・サイド合成）を試したい上級者向け: 自社でAPIを呼ぶ代わりに、
  // 外部の画像生成ツール（Gemini/ChatGPT等）にそのまま貼り付けられるプロンプト文を組み立てて渡す。
  // これにより画像生成のコスト・品質リスク・顔写真の取り扱いリスクを負わずに、
  // 「試したい人だけ試せる」導線を用意できる。
  function buildExternalPrompt(style){
    return "【最初に確認】このメッセージに人物写真が添付されていますか？添付されていない場合は、画像の生成は行わず「お顔がわかる写真を添付してください」とだけ返信してください。\n\n"
      + "写真が添付されている場合は、添付した人物写真の髪型だけを「" + style.name + "」（" + style.sub + "）に変更してください。"
      + "顔立ち・肌の色・背景はそのまま保持し、正面から見た写真と横顔（サイド）から見た写真の2枚を生成してください。";
  }

  /* =========================================================
     4. スタイリングアドバイス生成（テンプレート）
  ========================================================= */
  // スタイルの sub（例：「シースルーバング／ベージュカラー」）を
  // 「シースルーバング、ベージュカラー」のような読みやすいタグ文言に変換する
  function styleTagsText(style){
    var parts = (style.sub || "").split(/[・×／\/]/).map(function(p){ return p.trim(); }).filter(Boolean);
    return parts.length ? parts.join("、") : (style.sub || "");
  }

  function applyTabTheme(tabId){
    var t = tabInfo(tabId);
    var root = document.documentElement;
    root.style.setProperty("--tab-accent", "var(" + t.accent + ")");
    root.style.setProperty("--tab-accent-soft", "var(" + t.accentSoft + ")");
    byId("brandMark").style.background = "var(" + t.accent + ")";
    byId("brandMark").textContent = t.mark;
    byId("headerMode").textContent = t.mode;
    byId("headerMode").style.color = "var(" + t.accent + ")";
    byId("headerApp").textContent = t.app;
  }

  function renderTabbar(){
    var bar = byId("tabbar");
    bar.innerHTML = "";
    TABS.filter(function(t){ return BOTTOM_TAB_IDS.indexOf(t.id) !== -1; }).forEach(function(t){
      var badge = false;
      if(t.id==="fashion" && state.selectedStyle && !state.seenFashionBadge) badge = true;
      if(t.id==="restaurant" && state.selectedStyle && !state.seenRestaurantBadge) badge = true;
      var btn = el("button", "tab-btn" + (state.tab===t.id ? " active":"") + (badge ? " has-badge":""));
      btn.style.setProperty("--tab-color", "var(" + t.accent + ")");
      btn.innerHTML = ICONS[t.id] + '<span>'+t.label+'</span><span class="badge"></span>';
      btn.addEventListener("click", function(){
        state.tab = t.id;
        if(t.id==="fashion") state.seenFashionBadge = true;
        if(t.id==="restaurant") state.seenRestaurantBadge = true;
        saveState();
        render();
      });
      bar.appendChild(btn);
    });
  }

  var bellHasNote = false;
  function renderHeader(){
    applyTabTheme(state.tab);
    byId("bellBtn").classList.toggle("has-note", bellHasNote);
    var karteHasNote = !!(state.selectedStyle && !state.seenOrderBadge);
    byId("karteBtn").classList.toggle("has-note", karteHasNote);
    byId("karteBtn").classList.toggle("active", state.tab === "order");
    byId("infoBtn").classList.toggle("active", state.tab === "about");
  }

  // （性別を切り替えたときと、明示的な「最初から」ボタンの両方から呼び出す）
  function resetHairFlow(){
    state.chat = { started:false, log:[] };
    state.faceShape = null;
    state.selectedStyle = null;
    state.diagnosis = { texture:null, crown:null, curl:null };
    state.outfit = null;
    state.seenFashionBadge = false;
    state.seenRestaurantBadge = false;
    state.seenOrderBadge = false;
    saveState();
  }

  function renderSubbar(){
    var bar = byId("subbar");
    var showGenderToggle = (state.tab === "hair" || state.tab === "fashion" || state.tab === "restaurant");
    if(!showGenderToggle){
      bar.hidden = true;
      bar.innerHTML = "";
      return;
    }
    bar.hidden = false;
    bar.innerHTML = "";
    bar.appendChild(el("span", "subbar-label", "対象:"));
    var toggle = el("div", "gender-toggle");
    ["women","men"].forEach(function(g){
      var b = el("button", state.gender===g ? "active":"", genderLabel(g));
      b.addEventListener("click", function(){
        if(state.gender === g) return;
        state.gender = g;
        // 対象（メンズ/レディース）を切り替えたら、これまでの会話・選択結果はリセットして
        // 新しい性別の診断フローを最初からやり直せるようにする（ヘア・ファッション両方）
        resetHairFlow();
        resetFashionFlow();
        resetRestaurantFlow();
        render();
      });
      toggle.appendChild(b);
    });
    bar.appendChild(toggle);

    if(state.tab === "hair" || state.tab === "fashion" || state.tab === "restaurant"){
      var resetLink = el("button","close-link","🔄 最初から");
      resetLink.style.marginLeft = "auto";
      resetLink.addEventListener("click", function(){
        if(state.tab === "hair") resetHairFlow();
        else if(state.tab === "fashion") resetFashionFlow();
        else resetRestaurantFlow();
        render();
      });
      bar.appendChild(resetLink);
    }
  }

  function renderComposer(){
    var bar = byId("composer");
    var showComposer = (state.tab === "hair" || state.tab === "fashion" || state.tab === "restaurant");
    bar.hidden = !showComposer;
    byId("composerPlusBtn").hidden = (state.tab === "restaurant");
    byId("attachScreenshotBtn").hidden = (state.tab !== "hair");
    byId("attachFashionTodayBtn").hidden = (state.tab !== "fashion");
    byId("attachFashionReferenceBtn").hidden = (state.tab !== "fashion");
    if(state.tab === "fashion"){
      byId("composerInput").placeholder = "相談内容を入力（例：暑くなりそう）";
    }else if(state.tab === "restaurant"){
      byId("composerInput").placeholder = "エリアや予算を入力（例：渋谷、5000円くらい）";
    }else{
      byId("composerInput").placeholder = "メッセージを入力（例：短くしたい）";
    }
  }

  function render(){
    renderHeader();
    renderTabbar();
    renderSubbar();
    renderComposer();
    var screen = byId("screen");
    screen.innerHTML = "";
    screen.scrollTop = 0;
    if(state.tab==="hair") renderHairTab(screen);
    else if(state.tab==="fashion") renderFashionTab(screen);
    else if(state.tab==="restaurant") renderRestaurantTab(screen);
    else if(state.tab==="about") renderAboutScreen(screen);
    else renderOrderTab(screen);
  }

  // 入力欄に文言をセットして、次の一手をユーザーが確認・編集してから送信できるようにする
  function setComposerValue(text){
    var input = byId("composerInput");
    input.value = text;
    input.focus();
  }

  // 入力文言から長さの意図を推測する（自由入力にも対応する簡易パーサー。
  // 🔧 実運用では自然言語理解をAPI側に任せる想定）
  function parseLengthIntent(text){
    var t = text.toLowerCase();
    if(/おまかせ|お任せ/.test(text)) return "omakase";
    if(/ショート|短く|短め|短い/.test(text)) return "short";
    if(/ミディアム|ミディ|ミドル/.test(text)) return "mid";
    if(/ロング|長く|長め|長い/.test(text)) return "long";
    return null;
  }

  function submitComposer(){
    var input = byId("composerInput");
    var text = input.value.trim();
    if(!text) return;
    input.value = "";
    if(state.tab === "fashion") submitFashionText(text);
    else if(state.tab === "restaurant") submitRestaurantFreeText(text);
    else submitQuickText(text);
  }

  // メニューのボタン（既定の選択肢）やフリー入力のテキストを、その場で送信・実行する共通処理
  function submitQuickText(text){
    if(!text) return;
    pushLog({ type:"user", text: text });

    var lengthId = parseLengthIntent(text);
    if(lengthId){

  async function runHairComposite(style, selfieDataUrl){
    pushLog({ type:"ai", text:"AIがあなたの顔に髪型を合成して、正面・横顔の2面図を作成中です…数秒〜十数秒ほどお待ちください。" });
    pushLog({ type:"typing" });
    render();

    try{
      var res = await fetch("/api/generate-hairstyle-composite", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          userFaceImage: selfieDataUrl,
          styleName: style.name,
          styleSub: style.sub
        })
      });
      var data = await res.json().catch(function(){ return {}; });
      state.chat.log = state.chat.log.filter(function(x){ return x.type!=="typing"; });
      if(res.ok && data.image){
        pushLog({ type:"hair-composite-result", image:data.image, styleName:style.name });
      }else{
        console.error("hairstyle composite failed:", res.status, data.error);
        pushLog({ type:"ai", text:"画像の生成に失敗しました。時間をおいて再度お試しください。" });
      }
    }catch(e){
      state.chat.log = state.chat.log.filter(function(x){ return x.type!=="typing"; });
      pushLog({ type:"ai", text:"通信エラーが発生しました。時間をおいて再度お試しください。" });
    }
    render();
  }

  // 🔧 差し替えポイント：色の組み合わせ判定は本番ではAI（Gemini/Claude）による都度判定に置き換える

  function fashionPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function findFashionCombo(topColor, bottomColor){
    for(var i=0;i<FASHION_COMBOS.length;i++){
      if(FASHION_COMBOS[i].combo === topColor+'×'+bottomColor || FASHION_COMBOS[i].combo === bottomColor+'×'+topColor) return FASHION_COMBOS[i];

  function scoreFashionColorPair(top, bottom){
    var found = findFashionCombo(top, bottom);
    if(!found) return { score:1, info: genericFashionCombo(top, bottom) };
    if(found.combo === 'ブラック×ネイビー') return { score:0, info: found };
    return { score:2, info: found };
  }

  // 🔧 差し替えポイント：本番ではこの組み合わせ判定をAI（Gemini/Claude）に置き換える
  function buildFashionCoordinateRecommendation(){
    var pairs = [];
    state.fashionOwnedTops.forEach(function(top){
      state.fashionOwnedBottoms.forEach(function(bottom){
        var r = scoreFashionColorPair(top, bottom);
        pairs.push({ top:top, bottom:bottom, score:r.score, info:r.info });
      });
    });
    pairs.sort(function(a,b){ return b.score - a.score; });
    var best = pairs[0], second = pairs[1];

    state.fashionDiagnosis = {
      top:"トップス", bottom:"ボトムス", topColor:best.top, bottomColor:best.bottom,
      jewelry: fashionPick(state.gender === "men" ? FASHION_MENS_JEWELRY : FASHION_LADIES_JEWELRY)
    };
    state.fashionLastAdviceType = "coordinate";
    state.outfit = best.top+"×"+best.bottom;
    saveState();

    var html =
      "お持ちの色を拝見しました！<br><br>"+
      "🥇 <b>"+best.top+"×"+best.bottom+"</b>が一番のおすすめです。"+best.info.comment+"<br><br>"+
      (second ? ("🥈 次点では <b>"+second.top+"×"+second.bottom+"</b> も良い組み合わせです。<br><br>") : "")+
      "👟 <b>靴のアドバイス</b>："+best.info.shoe+"<br><br>"+
      fashionFinishTip();
    state.fashionLastAdvice = { rawText: fashionPlainText(html), combo: best.info };
    saveState();
    return html;
  }

      "ベースには <b>"+base+"</b> を、アクセントには <b>"+acc+"</b> を合わせると近いイメージが作れます。<br><br>"+
      fashionColorNote()+c.comment+"<br><br>"+

      fashionFinishTip();

  function buildFashionDetailAdviceHtml(){
    var d = state.fashionDiagnosis || { top:"トップス", bottom:"ボトムス", topColor:"ネイビー", bottomColor:"グレー" };

    // 実際にGemini Visionで解析済みの場合は、その結果をそのまま使う

      var aiHtml =

  // ---- 訂正文の検出（上下の種類・色）----
  var FASHION_ALL_TOPS = ['スーツジャケット','Tシャツ','ポロシャツ','シャツ','ニット','セーター','ブラウス','ワンピース','カーディガン'];
  var FASHION_ALL_BOTTOMS = ['スラックス','デニムパンツ','チノパン','ワイドパンツ','スカート','デニム','ズボン','パンツ'];
  var FASHION_COLOR_MAP = {'黒':'ブラック','紺':'ネイビー','白':'ホワイト','ネイビー':'ネイビー','ブラック':'ブラック','ホワイト':'ホワイト','グレー':'グレー','ベージュ':'ベージュ','アイボリー':'アイボリー','ブラウン':'ブラウン','カーキ':'カーキ'};

  function detectFashionCorrection(text){
    var foundTop = FASHION_ALL_TOPS.filter(function(k){ return text.indexOf(k)!==-1; })[0];
    var foundBottom = FASHION_ALL_BOTTOMS.filter(function(k){ return text.indexOf(k)!==-1; })[0];
    var negMatch = text.match(/(?:じゃなくて|ではなく|じゃなく)(.+)/);
    var searchTarget = negMatch ? negMatch[1] : text;
    var foundColorKey = Object.keys(FASHION_COLOR_MAP).filter(function(k){ return searchTarget.indexOf(k)!==-1; })[0];
    if(!foundColorKey) foundColorKey = Object.keys(FASHION_COLOR_MAP).filter(function(k){ return text.indexOf(k)!==-1; })[0];
    if(!foundTop && !foundBottom && !foundColorKey) return null;
    return { top: foundTop||null, bottom: foundBottom||null, color: foundColorKey ? FASHION_COLOR_MAP[foundColorKey] : null };
  }
  function applyFashionCorrection(corr){
    var d = state.fashionDiagnosis;
    if(!d) return;
    if(corr.top) d.top = corr.top;
    if(corr.bottom) d.bottom = corr.bottom;
    if(corr.color){
      if(corr.top) d.topColor = corr.color;
      else if(corr.bottom) d.bottomColor = corr.color;
      else d.topColor = corr.color;
    }
    // 訂正内容とAI解析結果の文言がズレないよう、訂正後はモックでの再生成に切り替える
    state.fashionAIAdvice = null;
    saveState();

  // ---- 天気・気温・日差しなどのキーワード検出 ----
  // 🔧 差し替えポイント：本番では天気API/位置情報＋AIによる判定に置き換える

    { keywords:['暑い','猛暑','真夏日','蒸し暑い','気温が高い','30度','35度'],

    { keywords:['寒い','冷え込む','氷点下','気温が低い','雪'],

    { keywords:['日差し','紫外線','uv'],

  ];
  function detectFashionWeatherAdvice(text){
    var lower = text.toLowerCase();
    var hit = FASHION_WEATHER_ADVICE.filter(function(w){
      return w.keywords.some(function(k){ return lower.indexOf(k)!==-1; });
    })[0];
    return hit ? hit.advice : null;
  }

  function detectFashionSmallTalk(text){
    var lower = text.toLowerCase();
    if(FASHION_GREETING_KEYWORDS.some(function(k){ return lower.indexOf(k)!==-1; })){
      return 'こんにちは！今日もおしゃれ楽しみましょう😊 気になることがあれば何でも聞いてください。';

        state.fashionDiagnosis = { top:data.top, bottom:data.bottom, topColor:data.topColor, bottomColor:data.bottomColor };
        state.fashionAIAdvice = {
          colorComment: data.colorComment, shoeAdvice: data.shoeAdvice,

        pushFashion({ type:"ai", text:"写真の分析に失敗しました。\n\n【エラー詳細（デバッグ用）】\n"+(data.error || ("status: "+res.status)) });

  function defaultRestaurantBudgetLabel(){

  // 自由入力から予算の意図を軽く読み取る簡易パーサー（🔧 実運用では自然言語理解をAPI側に任せる想定）
  function parseRestaurantBudgetIntent(text){
    var numMatch = text.match(/([0-9０-９,，]{3,6})\s*円/);
    if(numMatch){
      var normalized = numMatch[1]
        .replace(/[０-９]/g, function(d){ return String.fromCharCode(d.charCodeAt(0)-0xFEE0); })
        .replace(/[,，]/g,"");
      return { label: Number(normalized).toLocaleString() + "円くらい", note:null };
    }
    if(/高め|高く|贅沢|奮発/.test(text)) return { label:null, note:"予算はもっと高めが希望" };
    if(/安め|安く|リーズナブル|抑えめ/.test(text)) return { label:null, note:"予算はもっと控えめが希望" };
    return null;
  }

  function submitRestaurantFreeText(text){
    pushRestaurantLog({ type:"user", text: text });

    if(step === "location"){
      state.restaurant.location = text;
      saveState();
      proceedToRestaurantBudgetStep();
      return;
    }
    if(step === "budget"){
      var parsed = parseRestaurantBudgetIntent(text);
      if(parsed){
        state.restaurant.budgetLabel = parsed.label || defaultRestaurantBudgetLabel();
        state.restaurant.budgetNote = parsed.note;
      }else{
        state.restaurant.budgetLabel = defaultRestaurantBudgetLabel();
        state.restaurant.budgetNote = text;
      }
      saveState();
      runRestaurantSearch();
      return;
    }
    // 結果表示後の追加相談（雰囲気の希望など）は、条件に追記して再検索する
    state.restaurant.extraNote = text;
    saveState();
    runRestaurantSearch();
  }

  async function fetchRestaurantRecommendation(params){

    var editBtn = el("button","mini-btn","質問をやり直す");
    editBtn.addEventListener("click", function(){ state.diagnosis={texture:null,crown:null,curl:null}; saveState(); render(); });
    head.appendChild(editBtn);
    screen.appendChild(head);

    var mainCard = el("div","full-card");
    mainCard.innerHTML = duoCardMarkup(style) + '<div class="meta"><div><div class="name">'+style.name+'</div><div class="sub">'+genderLabel(style.gender)+' ・ '+lengthLabel(style.length)+'</div></div></div>';
    screen.appendChild(mainCard);

    var diagGrid = el("div","diag-grid");
    var diagFields = [
      { key:"texture", label:"髪質",   opts:TEXTURE_OPTS },
      { key:"crown",   label:"つむじ", opts:CROWN_OPTS },
      { key:"curl",    label:"癖毛",   opts:CURL_OPTS }
    ];
    diagFields.forEach(function(field){
      var item = el("div","diag-item");
      item.appendChild(el("div","k",field.label));
      var select = document.createElement("select");
      select.className = "v-select";
      field.opts.forEach(function(opt){
        var o = document.createElement("option");
        o.value = opt; o.textContent = opt;
        if(state.diagnosis[field.key] === opt) o.selected = true;
        select.appendChild(o);
      });
      select.addEventListener("change", function(){
        state.diagnosis[field.key] = select.value;
        saveState();
        render();
      });
      item.appendChild(select);
      diagGrid.appendChild(item);
    });
    screen.appendChild(diagGrid);

    screen.appendChild(el("div","section-label","美容師向けオーダー文言"));
    var advice = el("div","advice-box", buildAdvice(style, state.diagnosis));
    screen.appendChild(advice);

    // ---- 生成AIで自分の顔に試す（外部ツール用プロンプト作成） ----
    // 自社で画像生成APIは呼ばず、外部の生成AIツールにそのまま貼り付けられる
    // プロンプトを用意することで、コスト・品質リスク・顔写真の取り扱いリスクを避けつつ
    // 「もっと見たい」ユーザーの導線を用意する。
    screen.appendChild(el("div","section-label-highlight","AIヘアカット（おすすめ！）"));
    screen.appendChild(el("div","advice-box","ご自身の写真でこの髪型を試せます。下のプロンプトをコピーして、GeminiやChatGPTで試して生成できます。"));
    var promptLabel = el("div","","プロンプト：①コピー→②ChatGPT/Geminiで試す→③画像作成");
    promptLabel.style.cssText = "font-size:11.5px;font-weight:700;color:var(--tab-accent);margin-top:10px;margin-bottom:4px;";
    screen.appendChild(promptLabel);
    var promptBox = el("textarea","memo");
    promptBox.readOnly = true;
    promptBox.value = buildExternalPrompt(style);
    promptBox.style.minHeight = "76px";
    screen.appendChild(promptBox);

    var btnRow = el("div","btn-row");
    var copyBtn = el("button","mini-btn","📋 コピー");
    copyBtn.addEventListener("click", function(){ copyText(promptBox.value); });
    var chatgptBtn = el("button","mini-btn btn-chatgpt","ChatGPTで試す");
    chatgptBtn.addEventListener("click", function(){ copyAndOpen(promptBox.value, "https://chatgpt.com/", "ChatGPT"); });
    var geminiBtn = el("button","mini-btn btn-gemini","Geminiで試す");
    geminiBtn.addEventListener("click", function(){ copyAndOpen(promptBox.value, "https://gemini.google.com/app", "Gemini"); });
    btnRow.appendChild(copyBtn); btnRow.appendChild(chatgptBtn); btnRow.appendChild(geminiBtn);
    screen.appendChild(btnRow);

    var promptNote = el("div","");
    promptNote.style.cssText = "font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.6;";
    promptNote.textContent = "※生成結果の品質は保証されません。生成AIサービスの利用規約に従ってご利用ください。";
    screen.appendChild(promptNote);

    var saveBtn = el("button","btn","カルテを保存する");
    saveBtn.style.marginTop = "6px";
    saveBtn.addEventListener("click", function(){ saveState(); toast("カルテを保存しました（この端末に保存）"); });
    screen.appendChild(saveBtn);
  }

  function buildQuizBlock(question, opts, current, onSelect){
    var block = el("div","quiz-block");
    block.appendChild(el("div","quiz-q",question));
    var row = el("div","chip-row");
    row.style.paddingLeft = "0";
    opts.forEach(function(opt){
      var chip = el("button","chip" + (current===opt ? " selected":""), opt);
      chip.addEventListener("click", function(){ onSelect(opt); });
      row.appendChild(chip);
    });
    block.appendChild(row);
    return block;
  }

  function introCard(text, style){
    var wrap = el("div","bubble-row");
    wrap.appendChild(el("div","avatar-ai","髪"));
    var bub = el("div","bubble ai");
    bub.textContent = text + (style ? "（選択中: "+style.name+"）" : "");
    wrap.appendChild(bub);
    return wrap;
  }

  function emptyState(text, icon, btnLabel, onClick){
    var wrap = el("div","empty-state");
    wrap.innerHTML = icon + "<p></p>";
    wrap.querySelector("p").textContent = text;
    if(btnLabel){
      var btn = el("button","btn",btnLabel);
      btn.addEventListener("click", onClick);
      wrap.appendChild(btn);
    }
    return wrap;
  }

  /* =========================================================
     11. このアプリについて（共通フォーマット）
     -----------------------------------------------------------
     💡 このブロックは他アプリ（婚活アドバイザー等）にも
     そのまま流用できる想定の共通コンポーネントです。
     使い回す際は APP_ABOUT の中身だけ差し替えてください。
  ========================================================= */
  var APP_ABOUT = {
    avatarInitial: "J",
    avatarImage: "profile-avatar.jpg", // 🔧 差し替えポイント: public/直下の画像ファイル名。無ければavatarInitialを表示
    name: "はじめまして",
    // 🔧 差し替えポイント: 実際のお名前・写真に置き換えてください
    tagline: "恋活・婚活中のあなたの「似合う」を、後押しします。",
    story: "恋活・婚活の現場を見てきた中で、中身は素敵なのに、髪型やコーディネートで第一印象を損してしまっている方を何人も見てきました。美容師さんやスタイリストに相談する前の「予習」として、気軽に使ってもらえたらと思い、個人でこのアプリを開発しています。",
    appIntro: "スクアドは、スクリーンショットや写真をアップロードするだけでAIがアドバイスをくれる、恋活・婚活世代のためのビューティー・ライフスタイルアシスタントです。",
    appFeatures: [
      { icon:"hair",       label:"ヘア",       desc:"顔型に似合う髪型をAIが診断" },
      { icon:"fashion",    label:"ファッション", desc:"今日のコーデを色・靴までまるごとチェック" },
      { icon:"restaurant", label:"レストラン",  desc:"初デートにぴったりのお店をAIが提案" }
    ],
    dataNote: "アップロードした写真は、診断のために外部のAIサービスへ一時的に送信されるのみで、当方のサーバーに保存されることはありません。診断結果やメモなどのデータも、すべてこの端末（ブラウザ）内にのみ保存され、外部に共有されることはありません。",
    seriesApps: [
      { emoji:"💬", label:"恋活・婚活コミュニケーション", sub:"SCAD CHAT", kind:"external", url:"https://scad-chat.vercel.app/" },
      { icon:"hair", label:"ヘアスタイル", sub:"SCAD BEAUTY（このアプリ）", kind:"tab", tab:"hair" },
      { icon:"fashion", label:"ファッション", sub:"SCAD BEAUTY（このアプリ）", kind:"tab", tab:"fashion" },
      { emoji:"🔜", label:"その他", sub:"現在開発中", kind:"soon" }
    ],
    sns: [
      // 🔧 差し替えポイント: 実際のSNSリンクに置き換えてください
      { label:"Instagram", icon:"instagram", url:"https://instagram.com/" },
      { label:"X",         icon:"x",         url:"https://x.com/" }
    ]
  };

  // ヘッダーの「このアプリについて」アイコンを、汎用のiマークから開発者アバターに差し替える
  if(APP_ABOUT.avatarImage){
    byId("infoBtn").innerHTML = '<img src="'+APP_ABOUT.avatarImage+'" alt="このアプリについて" style="width:22px;height:22px;border-radius:50%;object-fit:cover;display:block;">';
  }

  function renderAboutScreen(screen){
    var closeBtn = el("button","close-link","← 閉じる");
    closeBtn.addEventListener("click", function(){ state.tab = "hair"; render(); });
    screen.appendChild(closeBtn);

    var head = el("div","about-header");
    var avatarHtml = APP_ABOUT.avatarImage
      ? '<img src="'+APP_ABOUT.avatarImage+'" alt="'+APP_ABOUT.name+'">'
      : APP_ABOUT.avatarInitial;
    head.innerHTML =
      '<div class="about-avatar">'+avatarHtml+'</div>'+
      '<div><div class="about-name">'+APP_ABOUT.name+'</div><div class="about-tagline">'+APP_ABOUT.tagline+'</div></div>';
    screen.appendChild(head);

    // ---- ①開発者について ----
    screen.appendChild(el("div","section-label","私について"));
    screen.appendChild(el("div","advice-box", APP_ABOUT.story));

    // ---- ②このアプリについて ----
    screen.appendChild(el("div","section-label","このアプリについて"));
    screen.appendChild(el("div","advice-box", APP_ABOUT.appIntro));
    var featureList = el("div","");
    featureList.style.cssText = "display:flex;flex-direction:column;gap:8px;margin-top:8px;";
    APP_ABOUT.appFeatures.forEach(function(f){
      var row = el("div","");
      row.style.cssText = "display:flex;align-items:flex-start;gap:9px;";
      var iconWrap = el("div","");
      iconWrap.style.cssText = "width:26px;height:26px;border-radius:50%;background:var(--tab-accent-soft);color:var(--tab-accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;";
      iconWrap.innerHTML = '<span style="width:14px;height:14px;display:flex;">'+ICONS[f.icon]+'</span>';
      row.appendChild(iconWrap);
      var textWrap = el("div","");
      textWrap.innerHTML = '<div style="font-size:12.5px;font-weight:700;">'+f.label+'</div><div style="font-size:11.5px;color:var(--ink-soft);margin-top:1px;">'+f.desc+'</div>';
      row.appendChild(textWrap);
      featureList.appendChild(row);
    });
    screen.appendChild(featureList);

    // ---- ③個人情報保護 ----
    screen.appendChild(el("div","section-label","個人情報の取り扱いについて"));
    screen.appendChild(el("div","advice-box", APP_ABOUT.dataNote));

    // ---- ④SCADシリーズ（関連アプリ）----
    screen.appendChild(el("div","section-label","SCADシリーズ"));
    var seriesList = el("div","series-list");
    APP_ABOUT.seriesApps.forEach(function(app){
      var isSoon = app.kind === "soon";
      var row;
      if(app.kind === "external"){
        row = document.createElement("a");
        row.href = app.url;
        row.target = "_blank";
        row.rel = "noopener noreferrer";
      }else if(app.kind === "tab"){
        row = document.createElement("button");
        row.type = "button";
        row.addEventListener("click", function(){ state.tab = app.tab; render(); });
      }else{
        row = document.createElement("div");
      }
      row.className = "series-row" + (isSoon ? " soon" : "");
      var iconHtml = app.icon ? ICONS[app.icon] : app.emoji;
      row.innerHTML =
        '<span class="series-icon">'+iconHtml+'</span>'+
        '<span class="series-text"><span class="series-label">'+app.label+'</span><span class="series-sub">'+app.sub+'</span></span>'+
        (isSoon ? '<span class="tag">近日公開</span>' : '<span class="series-arrow">›</span>');
      seriesList.appendChild(row);
    });
    screen.appendChild(seriesList);

    // ---- お問い合わせ・SNS ----
    screen.appendChild(el("div","section-label","お問い合わせ・SNS"));
    var snsRow = el("div","sns-row");
    APP_ABOUT.sns.forEach(function(s){
      var a = document.createElement("a");
      a.className = "sns-btn";
      a.href = s.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.setAttribute("aria-label", s.label);
      a.innerHTML = ICONS[s.icon] || "";
      snsRow.appendChild(a);
    });
    screen.appendChild(snsRow);
  }

  byId("bellBtn").addEventListener("click", function(){
    bellHasNote = false;
    render();
    if(state.selectedStyle){
      toast("「"+state.selectedStyle.name+"」に合うコーデ・お店の提案があります");
    }
  });

  /* =========================================================
     11. 初期化
  ========================================================= */
  render();
})();
</script>

</body>
</html>
